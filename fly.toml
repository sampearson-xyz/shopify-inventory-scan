# fly.toml app configuration file generated for inventory-card-scan on 2026-10-27T12:11:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inventory-card-scan'
primary_region = 'lhr'

[build]
[env]
  PORT = '3000'
  SHOPIFY_APP_URL = 'https://inventory-card-scan.fly.dev'

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
